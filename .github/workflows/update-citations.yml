name: Update citation count

on:
  schedule:
    # Every Monday at 11:17 Beijing time (03:17 UTC).
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "scripts/update_citations.py"
      - ".github/workflows/update-citations.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Update citation data
        run: python scripts/update_citations.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add citation_data.json
          if git diff --cached --quiet; then
            echo "Citation data is unchanged."
          else
            git commit -m "Update citation count"
            git push
          fi
